# Brain Tumor MRI Classification - Experiment Configuration

project:
  name: brain_tumor_mri
  seed: 42

paths:
  raw_data: data/raw
  processed_data: data/processed
  results: results
  figures: results/figures
  logs: results/logs
  metrics: results/metrics
  checkpoints: models

data:
  dataset_handle: masoudnickparvar/brain-tumor-mri-dataset
  classes: [glioma, meningioma, notumor, pituitary]
  image_size: 224
  num_channels: 3
  # Stratified split ratios (must sum to 1.0)
  split:
    train: 0.70
    val: 0.15
    test: 0.15

preprocessing:
  resize: [224, 224]
  normalize:
    mean: [0.485, 0.456, 0.406]   # ImageNet stats (transfer learning)
    std: [0.229, 0.224, 0.225]

augmentation:
  rotation_limit: 15
  horizontal_flip_p: 0.5
  scale_limit: 0.10            # zoom +-10%
  brightness_contrast_p: 0.3
  brightness_limit: 0.15
  contrast_limit: 0.15
  elastic_p: 0.15
  elastic_alpha: 30
  elastic_sigma: 4

model:
  name: custom_cnn          # custom_cnn | vgg16 | resnet50 | efficientnetb0 | mobilenetv2
  pretrained: true
  freeze_backbone: true     # transfer models: train classifier head only
  dropout: 0.5

training:
  batch_size: 32
  num_workers: 0              # 0 on Windows; increase on Linux
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adamw            # adamw | adam | sgd
  scheduler: cosine           # cosine | step | plateau
  use_class_weights: false    # dataset is ~balanced after cleaning
  early_stopping_patience: 7

tracking:
  backend: tensorboard        # tensorboard | wandb
  log_dir: results/logs
